<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Gold Gradients for Outer Ring and Pointer -->
        <linearGradient id="gold-ring" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#fff04d" />
            <stop offset="20%" stop-color="#ffb800" />
            <stop offset="50%" stop-color="#f57c00" />
            <stop offset="80%" stop-color="#ffb800" />
            <stop offset="100%" stop-color="#f57c00" />
        </linearGradient>

        <linearGradient id="gold-center" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f57c00" />
            <stop offset="50%" stop-color="#ffb800" />
            <stop offset="100%" stop-color="#fff04d" />
        </linearGradient>
        
        <linearGradient id="gold-pointer" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffdd00" />
            <stop offset="100%" stop-color="#e67e00" />
        </linearGradient>

        <!-- Vibrant Wedge Gradients (Bottom to Top shading) -->
        <linearGradient id="wedge-blue" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#1ea0ff" />
            <stop offset="100%" stop-color="#0066cc" />
        </linearGradient>
        
        <linearGradient id="wedge-red" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ff5252" />
            <stop offset="100%" stop-color="#cc0000" />
        </linearGradient>

        <linearGradient id="wedge-pink" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ff4791" />
            <stop offset="100%" stop-color="#c2005a" />
        </linearGradient>

        <linearGradient id="wedge-green" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#3de33d" />
            <stop offset="100%" stop-color="#008f00" />
        </linearGradient>

        <linearGradient id="wedge-purple" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#b05eff" />
            <stop offset="100%" stop-color="#6b00d6" />
        </linearGradient>

        <linearGradient id="wedge-yellow" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ffeb3b" />
            <stop offset="100%" stop-color="#e68a00" />
        </linearGradient>

        <!-- Global inner shadow to give the wheel depth at the edges -->
        <radialGradient id="inner-shadow" cx="50%" cy="50%" r="50%">
            <stop offset="75%" stop-color="#000" stop-opacity="0" />
            <stop offset="95%" stop-color="#000" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#000" stop-opacity="0.3" />
        </radialGradient>

        <clipPath id="wheel-clip">
            <circle cx="250" cy="250" r="205" />
        </clipPath>
    </defs>

    <!-- Main Drop Shadow for the entire wheel -->
    <circle cx="250" cy="256" r="235" fill="rgba(0,0,0,0.2)" />

    <!-- Solid Base to prevent transparency leaks -->
    <circle cx="250" cy="250" r="235" fill="url(#gold-ring)" />

    <!-- Clipped Wheel Segments -->
    <g clip-path="url(#wheel-clip)">
        <!-- Base White/Gray Background for the alternating wedges -->
        <circle cx="250" cy="250" r="205" fill="#f4f4f4" />
        
        <!-- 6 Colored Wedges (Each is 30 degrees wide, centered dynamically) -->
        <polygon points="250,250 169.6,-50 330.4,-50" fill="url(#wedge-blue)" transform="rotate(0 250 250)" />
        <polygon points="250,250 169.6,-50 330.4,-50" fill="url(#wedge-red)" transform="rotate(60 250 250)" />
        <polygon points="250,250 169.6,-50 330.4,-50" fill="url(#wedge-pink)" transform="rotate(120 250 250)" />
        <polygon points="250,250 169.6,-50 330.4,-50" fill="url(#wedge-green)" transform="rotate(180 250 250)" />
        <polygon points="250,250 169.6,-50 330.4,-50" fill="url(#wedge-purple)" transform="rotate(240 250 250)" />
        <polygon points="250,250 169.6,-50 330.4,-50" fill="url(#wedge-yellow)" transform="rotate(300 250 250)" />

        <!-- 3D Inner Shadow Overlay -->
        <circle cx="250" cy="250" r="205" fill="url(#inner-shadow)" />
    </g>

    <!-- Outer Gold Ring (Hollow overlap) -->
    <circle cx="250" cy="250" r="220" fill="none" stroke="url(#gold-ring)" stroke-width="30" />
    
    <!-- Fine Ring Details (Inner & Outer borders for bevel effect) -->
    <circle cx="250" cy="250" r="235" fill="none" stroke="#d35400" stroke-width="2" />
    <circle cx="250" cy="250" r="205" fill="none" stroke="#ffc107" stroke-width="4" opacity="0.8" />
    <circle cx="250" cy="250" r="203" fill="none" stroke="#000" stroke-width="1" opacity="0.1" />

    <!-- Rivets / Dots along the Outer Ring -->
    <g fill="#e67e22" stroke="#f1c40f" stroke-width="1.2">
        <circle cx="250" cy="30" r="4.5" transform="rotate(0 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(30 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(60 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(90 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(120 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(150 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(180 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(210 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(240 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(270 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(300 250 250)" />
        <circle cx="250" cy="30" r="4.5" transform="rotate(330 250 250)" />
    </g>

    <!-- Center Button Shadow -->
    <circle cx="250" cy="253" r="45" fill="rgba(0,0,0,0.3)" />

    <!-- Center Button Base -->
    <circle cx="250" cy="250" r="45" fill="url(#gold-ring)" />
    <circle cx="250" cy="250" r="38" fill="url(#gold-center)" stroke="#e67e22" stroke-width="1.5" />
    
    <!-- Center Orange Star -->
    <g transform="translate(0, 1)">
        <path d="M 250 228 L 255.0 243.2 L 270.9 243.2 L 258.1 252.6 L 262.9 267.8 L 250 258.5 L 237.1 267.8 L 241.9 252.6 L 229.1 243.2 L 245.0 243.2 Z" fill="#ff8c00" stroke="#e65c00" stroke-width="1" />
    </g>

</svg>
